name: Containers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b2d0a0d4ff2a1ac526460c8c29ce1abc4d8d # v4
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v5
        with:
          node-version: 26
          cache: pnpm
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Image builds
        run: docker build -t lilboard:verify .

  publish:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/login-action@5e57cd118135c994447655c1a9990d153e0f85a8 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3aca0b1d260b8dc52 # v3
      - uses: docker/build-push-action@c60e68c46b30d189caa1dad40e51d527a9d6f0db # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/lilco-dev/lilboard:latest
            ghcr.io/lilco-dev/lilboard:${{ github.sha }}
          cache-from: type=gha,scope=lilboard
          cache-to: type=gha,mode=max,scope=lilboard
